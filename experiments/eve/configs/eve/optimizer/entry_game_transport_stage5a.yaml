# @package _global_

optimizer:
  initial_guidance: ${oc.env:EVE_STAGE5A_GUIDANCE_ROOT}
  workers:
    selection: random
    items:
      - name: entry-game-transport-stage5a
        weight: 1.0
        immutable: ${oc.env:EVE_RUNTIME_OVERLAY_ROOT}/stage5a_entry_game_transport/immutable
        prompt: ${oc.env:EVE_RUNTIME_OVERLAY_ROOT}/stage5a_entry_game_transport/prompt
  immutable_renderer:
    _target_: scaling_evolve.algorithms.eve.workspace.immutable_renderers.default.DefaultRenderer
  evaluation:
    _target_: scaling_evolve.algorithms.eve.populations.evaluators.elo.ScalarEloEvaluator
    k_factor: 32.0
    initial_score:
      elo: 1500.0
