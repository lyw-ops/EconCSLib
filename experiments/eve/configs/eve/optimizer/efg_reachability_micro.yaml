# @package _global_

optimizer:
  initial_guidance: ${oc.env:EVE_RUNTIME_OVERLAY_ROOT}/efg_reachability_micro/initial_guidance
  workers:
    selection: random
    items:
      - name: efg-reachability-micro
        weight: 1.0
        immutable: ${oc.env:EVE_RUNTIME_OVERLAY_ROOT}/efg_reachability_micro/immutable
        prompt: ${oc.env:EVE_RUNTIME_OVERLAY_ROOT}/efg_reachability_micro/prompt
  immutable_renderer:
    _target_: scaling_evolve.algorithms.eve.workspace.immutable_renderers.default.DefaultRenderer
  evaluation:
    _target_: scaling_evolve.algorithms.eve.populations.evaluators.elo.ScalarEloEvaluator
    k_factor: 32.0
    initial_score:
      elo: 1500.0
