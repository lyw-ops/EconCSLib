name: Build Lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, experiment/efg-review-baseline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Official Lean CI action: installs the pinned toolchain, restores the
      # Lake/Mathlib caches, runs `lake build`, and independently rechecks the
      # environment with leanchecker.
      - name: Build and validate Lean
        uses: leanprover/lean-action@v1
        with:
          build: true
          leanchecker: true

      # These project-specific checks remain outside lean-action.
      - name: Build examples
        run: lake build EconCSLib.Examples

      - name: Build every governed EFG module
        run: python3 scripts/build_efg_modules.py --fresh

      - name: Check Lean sources for placeholders
        run: python3 scripts/check_lean_placeholders.py EconCSLib

      - name: Check EFG architecture governance
        run: python3 scripts/check_efg_governance.py

      - name: Test EFG governance tooling
        run: |
          python3 -m unittest \
            tests/test_check_efg_api_growth.py \
            tests/test_check_commit_scope.py \
            tests/test_check_efg_governance.py \
            tests/test_report_efg_declaration_usage.py

      - name: Enforce the EFG API-growth freeze
        run: python3 scripts/check_efg_api_growth.py

      - name: Report EFG declaration usage
        run: |
          python3 scripts/report_efg_declaration_usage.py \
            --check \
            --output /tmp/efg-declaration-usage.md

      - name: Upload EFG declaration usage report
        uses: actions/upload-artifact@v4
        with:
          name: efg-declaration-usage
          path: /tmp/efg-declaration-usage.md

      - name: Check per-commit review scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check_commit_scope.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --grandfather-commit 8f2009531d0e71f3891b732bffdf1731414d2640 \
              --grandfather-commit ad4ebea4dbb84ef91d9e0fdc4d7356f9e22cd6f8 \
              --grandfather-commit c42e9b0d7a610c11bd596f71b339b78de6944b74 \
              --grandfather-commit 69368f1a18534c8abb5f6c20e8154b48af57abe8
          fi

      - name: Check diff whitespace
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi
